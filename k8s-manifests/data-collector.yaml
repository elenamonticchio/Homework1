apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app: data-collector }
  template:
    metadata:
      labels: { app: data-collector, monitor: prometheus }
    spec:
      containers:
        - name: data-collector
          image: data-collector:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: DATA_COL_DB_HOST } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATA_DB_PASSWORD } }
            - name: OPEN_SKY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: app-secrets, key: OPEN_SKY_CLIENT_ID } }
            - name: OPEN_SKY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: OPEN_SKY_CLIENT_SECRET } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - containerPort: 5002
            - containerPort: 9991
---
apiVersion: v1
kind: Service
metadata:
  name: data-collector
spec:
  selector: { app: data-collector }
  ports:
    - name: http
      port: 5002
      targetPort: 5002
    - name: metrics
      port: 9991
      targetPort: 9991