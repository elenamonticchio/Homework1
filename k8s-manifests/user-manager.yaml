apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-manager
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-manager }
  template:
    metadata:
      labels: { app: user-manager, monitor: prometheus }
    spec:
      containers:
        - name: user-manager
          image: user-manager:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: USER_MGR_DB_HOST } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DB_PASSWORD } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - containerPort: 5003
            - containerPort: 50051
            - containerPort: 9992
---
apiVersion: v1
kind: Service
metadata:
  name: user-manager
spec:
  selector: { app: user-manager }
  ports:
    - name: http
      port: 5003
      targetPort: 5003
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9992
      targetPort: 9992