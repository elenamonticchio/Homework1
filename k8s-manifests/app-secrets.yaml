apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # Data DB Secrets
  DATA_DB_ROOT_PASSWORD: "data_root_pwd"
  DATA_DB_USER: "data_user"
  DATA_DB_PASSWORD: "data_app_pwd"
  # User DB Secrets
  USER_DB_ROOT_PASSWORD: "user_root_pwd"
